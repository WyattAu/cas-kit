# WyattAu dependency governance — cargo-deny configuration.
# Copy to the repo root. Policies: see engineering-standards README §7.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Documented unmaintained-crate ignores (fleet pattern: targeted update first;
# ignore with reason + tracking as last resort). Both advisories enter the
# graph exclusively through `iai-callgrind` 0.16.1 (dev-dependency, iai bench
# gate added in 0.2.1), which is at its latest release and offers no
# replacement yet. Neither crate ships in the published library or the
# cas-gc binary — they are bench-harness-only. Revisit on the next
# iai-callgrind release; if unmaintained then, port the iai benches.
ignore = [
  # bincode 1.x declared unmaintained by its authors (no safe upgrade exists;
  # iai-callgrind still depends on 1.3.3 for runner IPC).
  "RUSTSEC-2025-0141",
  # proc-macro-error2 unmaintained (via iai-callgrind-macros; author confirms
  # no further maintenance, no released successor dependency yet).
  "RUSTSEC-2026-0173",
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
